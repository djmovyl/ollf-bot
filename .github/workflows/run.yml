name: FC ITPROVIDER Match Bot

on:
  schedule:
    # Пятница–воскресенье, каждые 10 минут.
    # В cron дни недели считаются по UTC: 5=пт, 6=сб, 7=вс (0 — тоже вс).
    # GitHub Actions всегда работает по UTC: UTC пятница 00:00 = МСК 03:00,
    # UTC воскресенье 23:59 = МСК понедельник 02:59. Ночные часы (00:00–03:00
    # МСК в пятницу) и не нужны — матчи и посты идут с утра и позже.
    - cron: "*/10 * * * 5-7"
  workflow_dispatch:         # ручной запуск для проверки (и реплея)

# Не гонять два прогона параллельно, если предыдущий ещё не кончился
concurrency:
  group: bot-run
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Restore bot state
        uses: actions/cache/restore@v4
        with:
          path: prod_state.json
          key: bot-state-${{ github.run_id }}
          restore-keys: |
            bot-state-

      - name: Run bot
        run: python bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL: ${{ secrets.CHANNEL }}
          CHANNEL_2: ${{ secrets.CHANNEL_2 }}
          TG_API_URL: ${{ secrets.TG_API_URL }}
          TG_PROXY_SECRET: ${{ secrets.TG_PROXY_SECRET }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          STREAM_URL: ${{ secrets.STREAM_URL }}
          # Ручной запуск (кнопка) -> реплей test_live,
          # плановый прогон по cron -> боевой prod
          BOT_MODE: ${{ github.event_name == 'workflow_dispatch' && 'test_live' || 'prod' }}

      - name: Save bot state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: prod_state.json
          key: bot-state-${{ github.run_id }}
