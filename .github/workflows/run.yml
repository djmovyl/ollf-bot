name: FC ITPROVIDER Match Bot

on:
  schedule:
    # Будни и суббота: раз в 10 минут — хватает для фона,
    # вчетверо экономнее лимита минут (если репо приватный)
    - cron: "*/10 * * * *"
    # Воскресенье (игровой день): каждые 5 минут — лайв
    - cron: "*/5 * * * 0"
  workflow_dispatch:         # ручной запуск для проверки

# Не гонять два прогона параллельно, если предыдущий ещё не кончился
concurrency:
  group: bot-run
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Restore bot state
        uses: actions/cache/restore@v4
        with:
          path: prod_state.json
          key: bot-state-${{ github.run_id }}
          restore-keys: |
            bot-state-

      - name: Run bot
        run: python bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL: ${{ secrets.CHANNEL }}
          TG_API_URL: ${{ secrets.TG_API_URL }}
          TG_PROXY_SECRET: ${{ secrets.TG_PROXY_SECRET }}

      - name: Save bot state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: prod_state.json
          key: bot-state-${{ github.run_id }}
