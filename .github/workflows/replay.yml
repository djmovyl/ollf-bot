name: FC ITPROVIDER Replay (test posts)

on:
  workflow_dispatch:
    inputs:
      reset:
        description: "Сбросить состояние (постить всё заново)?"
        type: choice
        options:
          - no
          - yes
        default: no

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Restore replay state
        uses: actions/cache/restore@v4
        with:
          path: test_state.json
          key: replay-state-${{ github.run_id }}
          restore-keys: |
            replay-state-

      - name: Run replay
        run: python replay.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL: ${{ secrets.CHANNEL }}
          REPLAY_CHANNEL: ${{ secrets.REPLAY_CHANNEL }}
          REPLAY_RESET: ${{ inputs.reset }}
          TG_API_URL: ${{ secrets.TG_API_URL }}
          TG_PROXY_SECRET: ${{ secrets.TG_PROXY_SECRET }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          STREAM_URL: ${{ secrets.STREAM_URL }}

      - name: Save replay state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: test_state.json
          key: replay-state-${{ github.run_id }}
